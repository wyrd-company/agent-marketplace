name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  plugins:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check marketplaces and plugin manifests agree
        run: python3 scripts/check-plugins.py

      - name: Check hook scripts
        run: shellcheck plugins/*/scripts/*.sh

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: Validate the Claude Code marketplace and plugins
        run: |
          npm install --global @anthropic-ai/claude-code
          claude plugin validate .
          for plugin in plugins/*/; do
            if [ -f "$plugin/.claude-plugin/plugin.json" ]; then
              claude plugin validate "$plugin"
            fi
          done
