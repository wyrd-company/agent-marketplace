# yaml-language-server: $schema=https://wyrd.foo/schemas/docs/v1.json
# Products published to wyrd.foo: one entry per plugin whose source lives in this repo. Plugins that
# live in their own repo (async-codex-mcp, async-claude-agentsdk-mcp) are published from there.
# Each plugin's docs folder is docs/user/<key>/.
schemaVersion: 1
products:
  git-operator:
    name: git-operator
    version: 0.1.0
    docs-version: 0.1.0
    tagline: Keep each T3 Code thread's git commits attributed to the human operator it works for.
    blurb: >-
      A session-start hook for Claude Code and Codex in shared Wyrd workspaces. It tells the agent
      which operator its T3 Code thread is registered to, or asks it to have the user register one,
      so plain git, scripts and hooks commit and push as the right person. It needs the workspace
      git shim and `git operator` command from workspace-dotfiles.
    status: preview
    category: Git & Review
    highlights:
      - Reminds the agent at session start, resume and compaction which operator the thread commits as.
      - Asks the agent to have the user register an operator before the thread's first commit, push or fetch.
      - Passes a thread's operator to the threads it starts through `git operator set --from`, never through message text.
      - Prints nothing outside T3 Code threads, or where the workspace git shim is not installed.
    kinds:
      - kind: coding-harness-plugin
        install:
          - harness: Claude Code
            default: true
            command: |-
              claude plugin marketplace add wyrd-company/agent-marketplace
              claude plugin install git-operator@wyrd-company
          - harness: Codex
            command: |-
              codex plugin marketplace add wyrd-company/agent-marketplace
              codex plugin add git-operator@wyrd-company
        provides:
          - element: hook
            name: SessionStart
            description: Adds the thread's git operator, or the instruction to register one, to the model's context.
